name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"
      - "V*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.reference.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
      release_label: ${{ steps.metadata.outputs.release_label }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      harmony_version_code: ${{ steps.metadata.outputs.harmony_version_code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Require tag commit on main
        id: reference
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch --tags --prune origin
          git fetch --no-tags origin main
          if ! TAG_COMMIT="$(git rev-parse --verify \
            "refs/tags/${REQUESTED_TAG}^{commit}")"; then
            echo "Release tag ${REQUESTED_TAG} does not exist" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "Release tag must point to a commit contained in main" >&2
            exit 1
          fi
          {
            echo "tag=${REQUESTED_TAG}"
            echo "commit=${TAG_COMMIT}"
          } >> "${GITHUB_OUTPUT}"
      - name: Test release metadata tooling
        run: python3 -m unittest discover -s tools/release -p "test_*.py"
      - name: Validate tag and project versions
        id: metadata
        env:
          REQUESTED_TAG: ${{ steps.reference.outputs.tag }}
        run: |
          VALIDATION_TAG="${REQUESTED_TAG}"
          if [[ "${VALIDATION_TAG}" == V* ]]; then
            VALIDATION_TAG="v${VALIDATION_TAG:1}"
          fi
          python3 tools/release/prepare_release.py \
            --tag "${VALIDATION_TAG}" \
            --github-output "${GITHUB_OUTPUT}"
          echo "tag=${REQUESTED_TAG}" >> "${GITHUB_OUTPUT}"

  release-preflight:
    name: Validate release credentials
    needs: validate
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Require Developer ID and notarization credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          missing=()
          [[ -n "${CERTIFICATE_BASE64}" ]] ||
            missing+=("MACOS_DEVELOPER_ID_P12_BASE64")
          [[ -n "${CERTIFICATE_PASSWORD}" ]] ||
            missing+=("MACOS_DEVELOPER_ID_P12_PASSWORD")
          [[ -n "${SIGN_IDENTITY}" ]] ||
            missing+=("MACOS_SIGN_IDENTITY")
          [[ -n "${NOTARY_KEY_BASE64}" ]] ||
            missing+=("APPLE_NOTARY_KEY_P8_BASE64")
          [[ -n "${NOTARY_KEY_ID}" ]] ||
            missing+=("APPLE_NOTARY_KEY_ID")
          [[ -n "${NOTARY_ISSUER_ID}" ]] ||
            missing+=("APPLE_NOTARY_ISSUER_ID")
          if ((${#missing[@]} > 0)); then
            echo "Missing release Environment secrets:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi

  macos-quality:
    name: macOS quality gate
    needs: [validate, release-preflight]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - name: Validate shared vectors
        run: python3 tools/validate_shared_vectors.py
      - name: Run Debug tests
        run: swift test -c debug
      - name: Run Release tests and logging policy
        run: swift test -c release
      - name: Enforce private API isolation
        run: |
          if rg -n '\bCGVirtualDisplay(Descriptor|Settings|Mode)?\b' \
            macos --glob '!macos/VirtualDisplayCore/PrivateAPIShim/**'; then
            echo 'CGVirtualDisplay private types must remain in PrivateAPIShim' >&2
            exit 1
          fi
      - name: Generate compatibility candidate
        run: python3 tools/macos_compatibility_smoke.py

  harmony-quality:
    name: HarmonyOS protocol quality gate
    needs: [validate, release-preflight]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - name: Configure protocol tests
        run: >
          cmake -S harmony/entry/src/main/cpp
          -B .build/harmony-host
          -DBUILD_PROTOCOL_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build protocol tests
        run: cmake --build .build/harmony-host --parallel
      - name: Run protocol tests
        run: ctest --test-dir .build/harmony-host --output-on-failure

  macos-package:
    name: Sign and notarize macOS DMG
    needs: [validate, release-preflight, macos-quality, harmony-quality]
    runs-on: macos-15
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - name: Require release credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          for variable in \
            CERTIFICATE_BASE64 CERTIFICATE_PASSWORD SIGN_IDENTITY \
            NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID
          do
            if [[ -z "${!variable}" ]]; then
              echo "Missing required release secret: ${variable}" >&2
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/second-display-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id.p12"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["RUNNER_TEMP"], "developer-id.p12").write_bytes(
              base64.b64decode(os.environ["CERTIFICATE_BASE64"], validate=True)
          )
          PY
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          {
            echo "MACOS_CI_KEYCHAIN=${KEYCHAIN_PATH}"
            echo "MACOS_CI_KEYCHAIN_PASSWORD=${KEYCHAIN_PASSWORD}"
          } >> "${GITHUB_ENV}"
      - name: Prepare App Store Connect notary key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          key_path = Path(os.environ["RUNNER_TEMP"], "notary-api-key.p8")
          key_path.write_bytes(
              base64.b64decode(os.environ["NOTARY_KEY_BASE64"], validate=True)
          )
          key_path.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"NOTARY_KEY_PATH={key_path}\n")
          PY
      - name: Detect package architecture
        id: platform
        run: echo "architecture=$(uname -m)" >> "${GITHUB_OUTPUT}"
      - name: Build, sign, and notarize DMG
        env:
          APP_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_LABEL: ${{ needs.validate.outputs.release_label }}
          APP_BUILD_NUMBER: ${{ github.run_number }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          INSTALL_LOCAL_PAIRING_IDENTITY: "0"
        run: tools/package_macos_dmg.sh
      - name: Verify notarized distribution
        env:
          REQUIRE_GATEKEEPER: "1"
          REQUIRE_NOTARIZATION: "1"
        run: >
          tools/verify_macos_distribution.sh
          "dist/SecondDisplay-${{ needs.validate.outputs.release_label }}-macos-${{ steps.platform.outputs.architecture }}.dmg"
      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          HARMONY_VERSION_CODE: ${{ needs.validate.outputs.harmony_version_code }}
        run: |
          mkdir -p release-assets
          ditto \
            "dist/SecondDisplay-${{ needs.validate.outputs.release_label }}-macos-${{ steps.platform.outputs.architecture }}.dmg" \
            "release-assets/SecondDisplay-${{ needs.validate.outputs.release_label }}-macos-${{ steps.platform.outputs.architecture }}.dmg"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          information = {
              "tag": os.environ["RELEASE_TAG"],
              "version": os.environ["RELEASE_VERSION"],
              "commit": os.environ["RELEASE_COMMIT"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "harmonyVersionCode": int(os.environ["HARMONY_VERSION_CODE"]),
          }
          Path("release-assets/BUILD-INFO.json").write_text(
              json.dumps(information, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd release-assets
            shasum -a 256 SecondDisplay-*.dmg > SHA256SUMS-macos.txt
          )
      - name: Attest DMG provenance
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*.dmg
      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -n "${MACOS_CI_KEYCHAIN:-}" ]]; then
            security delete-keychain "${MACOS_CI_KEYCHAIN}" || true
          fi

  harmony-build:
    name: Verify HarmonyOS application build
    if: vars.ENABLE_HARMONY_BUILD == 'true'
    needs: [validate, macos-quality, harmony-quality]
    runs-on: [self-hosted, harmonyos-build]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - name: Prepare unsigned build configuration
        run: |
          if rg -n '"signingConfigs?"|"material"|"storeFile"|"profile"' \
            harmony/build-profile.ci.json5; then
            echo "HarmonyOS CI build profile must not contain signing material" >&2
            exit 1
          fi
          cp harmony/build-profile.ci.json5 harmony/build-profile.json5
      - name: Compile HarmonyOS debug HAP
        working-directory: harmony
        run: |
          hvigorw clean --no-daemon
          hvigorw assembleHap \
            --mode module \
            -p product=default \
            -p module=entry@default \
            -p buildMode=debug \
            --no-daemon
      - name: Verify HAP output exists
        run: |
          if ! find harmony/entry/build -type f -name '*.hap' -print -quit \
            | grep -q .; then
            echo "HarmonyOS debug HAP was not produced" >&2
            exit 1
          fi

  publish:
    name: Publish GitHub Release
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.release-preflight.result == 'success' &&
      needs.macos-quality.result == 'success' &&
      needs.harmony-quality.result == 'success' &&
      needs.macos-package.result == 'success' &&
      (needs.harmony-build.result == 'success' ||
       needs.harmony-build.result == 'skipped')
    needs:
      - validate
      - release-preflight
      - macos-quality
      - harmony-quality
      - macos-package
      - harmony-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create combined checksums
        run: |
          (
            cd release-assets
            find . -maxdepth 1 -type f \
              ! -name 'SHA256SUMS*.txt' \
              -print0 \
              | sort -z \
              | xargs -0 shasum -a 256 > SHA256SUMS.txt
          )
      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft \
              --jq .isDraft)"
            if [[ "${IS_DRAFT}" != "true" ]]; then
              echo "Release ${RELEASE_TAG} already exists and is published" >&2
              exit 1
            fi
          else
            arguments=(
              "${RELEASE_TAG}"
              --repo "${GITHUB_REPOSITORY}"
              --title "Second Display ${RELEASE_VERSION}"
              --generate-notes
              --verify-tag
              --draft
            )
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              arguments+=(--prerelease)
            fi
            gh release create "${arguments[@]}"
          fi
          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            release-assets/*
          edit_arguments=(
            "${RELEASE_TAG}"
            --repo "${GITHUB_REPOSITORY}"
            --draft=false
          )
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            edit_arguments+=(--prerelease)
          else
            edit_arguments+=(--prerelease=false)
          fi
          gh release edit "${edit_arguments[@]}"
